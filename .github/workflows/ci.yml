name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Evidence and release hygiene
        run: |
          python scripts/export_public_evidence.py --out evidence --check
          python scripts/check_public_release.py --root . --regenerate-tables
      - name: Unit and integration tests
        run: python -m pytest -q
      - name: CPU smoke test
        run: python -m wikiorg smoke
